name: Refresh research and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 11:17 UTC = 06:17 Chicago during CDT, 05:17 during CST.
    # GitHub may delay scheduled jobs; this is a daily refresh, not real-time delivery.
    - cron: '17 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify public source
        run: python scripts/check_public_source.py --staged

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Refresh public ORCID research outputs
        # A failed API refresh stops deployment; the existing live site stays available.
        # No generated files are committed back to the repository.
        run: python scripts/sync_orcid.py

      - name: Restore the last theory reading-list snapshot
        id: theory-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: data/theory-papers.json
          key: theory-v1-${{ hashFiles('data/theory-sources.json', 'scripts/sync_theory.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            theory-v1-${{ hashFiles('data/theory-sources.json', 'scripts/sync_theory.py') }}-

      - name: Refresh followed theory researchers
        # No key is needed for basic requests. A repository secret can raise the API allowance.
        # Source failures retain cached papers and show their last successful update dates.
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/sync_theory.py

      - name: Preserve the theory snapshot for the next refresh
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/theory-papers.json
          key: ${{ steps.theory-cache.outputs.cache-primary-key }}

      - name: Build the English website
        run: python scripts/build_site.py --base-url https://drzhigong.github.io

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
